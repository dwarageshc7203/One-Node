name: Build and Test

on:
  push:
    branches: [ "main", "ui-fixes", "feature/*" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3

    - name: Install dependencies
      run: |
        sudo apt update
        sudo apt install -y qt6-base-dev cmake g++ ninja-build avahi-daemon libavahi-client-dev pkg-config

    - name: Build C++ Desktop App
      run: |
        mkdir build
        cd build
        cmake .. -G Ninja
        ninja

  build-android:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3

    - name: set up JDK 17
      uses: actions/setup-java@v3
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Grant execute permission for gradlew
      run: chmod +x DropIn/gradlew

    - name: Build with Gradle
      run: |
        cd DropIn
        ./gradlew assembleDebug
